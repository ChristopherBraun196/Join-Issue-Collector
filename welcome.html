<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Welcome</title>
    <link rel="stylesheet" href="./main.css" />
    <link
      rel="shortcut icon"
      href="./assets/img/logo-light.svg"
      type="image/x-icon"
    />
  </head>
  <body class="welcome-page">
    <main id="welcomeMain">
      <section aria-labelledby="welcome-heading">
        <h1 id="welcome-heading">Welcome</h1>
        <p>
          Pick the option that suits your role: create a request as a
          stakeholder or log in if you're part of the team.
        </p>
        <div class="welcome-options">
          <article>
            <h2>
              <img src="./assets/icons/work.svg" alt="" />Are you a stakeholder?
            </h2>
            <a href="./stakeholder.html" class="welcome-btn welcome-btn-primary"
              >Create request</a
            >
          </article>

          <article>
            <h2>
              <img src="./assets/icons/member.svg" alt="" />Are you a team
              member?
            </h2>
            <a href="./index.html" class="welcome-btn welcome-btn-secondary"
              >Member log in</a
            >
          </article>
        </div>
      </section>
    </main>
    <footer id="welcomeFooter">
      <a href="./privacy.html">Privacy Policy</a>
      <a href="./legal.html">Legal notice</a>
    </footer>
  </body>
</html>
