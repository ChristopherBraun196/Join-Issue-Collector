<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Board</title>
    <link rel="shortcut icon" href="./assets/img/logo-light.svg" type="image/x-icon" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/addTask.css" />
    <link rel="stylesheet" href="./css/assets.css" />
    <link rel="stylesheet" href="./css/board.css" />
    <link rel="stylesheet" href="./css/moveOverlay.css" />
    <link rel="stylesheet" href="./css/editboard.css" />
    <link rel="stylesheet" href="./css/confirmDialog.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/standard.css" />
  </head>

  <body>
    <aside class="sidebar"></aside>

    <main class="page page--full board">
      <section class="board__bar">
        <h1>Board</h1>
        <div class="board__search-wrap">
          <div class="board__search">
            <input class="board__search-input" type="text" role="search" placeholder="Find Task" />
            <div class="board__search-divider"></div>
            <button class="board__search-btn" data-action="search-task">
              <img src="./assets/icons/search.svg" class="board__search-icon" />
            </button>
          </div>
          <button class="primary-btn board__add-btn" data-action="add-task" data-status="toDo">Add task +</button>
        </div>
      </section>

      <section class="board__bar-mobile">
        <div class="board__mobile-header">
          <h1>Board</h1>
          <button class="board__add-btn-mobile" data-action="add-task" data-status="toDo">+</button>
        </div>
        <div class="board__search-wrap">
          <div class="board__search">
            <input class="board__search-input" type="text" role="search" placeholder="Find Task" />
            <div class="board__search-divider"></div>
            <button class="board__search-btn" data-action="search-task">
              <img src="./assets/icons/search.svg" class="board__search-icon" />
            </button>
          </div>
        </div>
      </section>

      <section class="board__columns">
        <div class="board__column">
          <div class="board__column-header">
            <h4>Triage</h4>
            <button class="board__plus-btn" data-action="add-task" data-status="triage">+</button>
          </div>
          <div class="board__column-body" data-column="triage">
            <button
              class="board__arrow board__arrow--up board__arrow--hidden"
              data-target="triage"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="board__placeholder board__placeholder--hidden" data-placeholder="triage">
              <p class="board__placeholder-text">No tasks in Triage</p>
            </div>
            <div class="board__cards" data-cards="triage"></div>

            <button
              class="board__arrow board__arrow--down board__arrow--hidden"
              data-target="triage"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board__column">
          <div class="board__column-header">
            <h4>To do</h4>
            <button class="board__plus-btn" data-action="add-task" data-status="toDo">+</button>
          </div>
          <div class="board__column-body" data-column="toDo">
            <button
              class="board__arrow board__arrow--up board__arrow--hidden"
              data-target="toDo"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="board__placeholder board__placeholder--hidden" data-placeholder="toDo">
              <p class="board__placeholder-text">No tasks in To do</p>
            </div>
            <div class="board__cards" data-cards="toDo"></div>
            <button
              class="board__arrow board__arrow--down board__arrow--hidden"
              data-target="toDo"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board__column">
          <div class="board__column-header">
            <h4>In progress</h4>
            <button class="board__plus-btn" data-action="add-task" data-status="inProgress">+</button>
          </div>
          <div class="board__column-body" data-column="inProgress">
            <button
              class="board__arrow board__arrow--up board__arrow--hidden"
              data-target="inProgress"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="board__placeholder board__placeholder--hidden" data-placeholder="inProgress">
              <p class="board__placeholder-text">No tasks in In progress</p>
            </div>
            <div class="board__cards" data-cards="inProgress"></div>
            <button
              class="board__arrow board__arrow--down board__arrow--hidden"
              data-target="inProgress"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board__column">
          <div class="board__column-header">
            <h4>Await feedback</h4>
            <button class="board__plus-btn" data-action="add-task" data-status="await">+</button>
          </div>
          <div class="board__column-body" data-column="await">
            <button
              class="board__arrow board__arrow--up board__arrow--hidden"
              data-target="await"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="board__placeholder board__placeholder--hidden" data-placeholder="await">
              <p class="board__placeholder-text">No tasks in Await feedback</p>
            </div>
            <div class="board__cards" data-cards="await"></div>

            <button
              class="board__arrow board__arrow--down board__arrow--hidden"
              data-target="await"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board__column">
          <div class="board__column-header">
            <h4>Done</h4>
          </div>
          <div class="board__column-body" data-column="done">
            <button
              class="board__arrow board__arrow--up board__arrow--hidden"
              data-target="done"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="board__placeholder board__placeholder--hidden" data-placeholder="done">
              <p class="board__placeholder-text">No tasks in Done</p>
            </div>
            <div class="board__cards" data-cards="done"></div>

            <button
              class="board__arrow board__arrow--down board__arrow--hidden"
              data-target="done"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>
      </section>
      <span class="toast"></span>
    </main>
    <dialog class="task-dialog"></dialog>
    <dialog class="confirm-dialog">
      <p class="confirm-dialog__text" tabindex="-1" autofocus></p>
      <div class="confirm-dialog__actions">
        <button class="secondary-btn confirm-dialog__btn confirm-dialog__btn--cancel" type="button" data-confirm="false">Cancel</button>
        <button class="primary-btn confirm-dialog__btn" type="button" data-confirm="true">Delete</button>
      </div>
    </dialog>
    <script type="module" src="./js/pages/board/boardPage.js"></script>
  </body>
</html>
