<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Board</title>
    <link rel="shortcut icon" href="./assets/img/logo-light.svg" type="image/x-icon" />
    <link rel="stylesheet" href="./main.css" />
  </head>

  <body>
    <aside class="sidebar"></aside>

    <main class="summary-add-task-board-main" id="board-main">
      <section class="board-bar">
        <h1>Board</h1>
        <div class="search-wrapper">
          <div class="search-input-group">
            <input class="find-task" type="text" role="search" placeholder="Find Task" />
            <div id="search-spacer"></div>
            <button class="search-btn" data-action="search-task">
              <img src="./assets/icons/search.svg" class="search-icon" />
            </button>
          </div>
          <button class="primary-btn add-task-btn" data-action="add-task" data-status="toDo">Add task +</button>
        </div>
      </section>

      <section class="board-bar-mobile">
        <div id="board-header">
          <h1>Board</h1>
          <button class="add-task-btn-mobile" data-action="add-task" data-status="toDo">+</button>
        </div>
        <div class="search-wrapper">
          <div class="search-input-group">
            <input class="find-task" type="text" role="search" placeholder="Find Task" />
            <div id="search-spacer"></div>
            <button class="search-btn" data-action="search-task">
              <img src="./assets/icons/search.svg" class="search-icon" />
            </button>
          </div>
        </div>
      </section>

      <section class="progress-board">
        <div class="board-task">
          <div class="board-task-header">
            <h4>Triage</h4>
            <button class="plus-btn" data-action="add-task" data-status="triage">+</button>
          </div>
          <div class="board-task-body" data-column="triage">
            <button
              class="scroll-arrow arrow-up hidden"
              data-target="triage"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="no-tasks-placeholder hidden" id="placeholder-triage">
              <p class="p-no-task">No Tasks in Triage</p>
            </div>
            <div id="triage" class="task-cards"></div>

            <button
              class="scroll-arrow arrow-down hidden"
              data-target="triage"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board-task">
          <div class="board-task-header">
            <h4>To do</h4>
            <button class="plus-btn" data-action="add-task" data-status="toDo">+</button>
          </div>
          <div class="board-task-body" data-column="toDo">
            <button
              class="scroll-arrow arrow-up hidden"
              data-target="toDo"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="no-tasks-placeholder hidden" id="placeholder-toDo">
              <p class="p-no-task">No Tasks to do</p>
            </div>
            <div id="toDo" class="task-cards"></div>
            <button
              class="scroll-arrow arrow-down hidden"
              data-target="toDo"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board-task">
          <div class="board-task-header">
            <h4>In progress</h4>
            <button class="plus-btn" data-action="add-task" data-status="inProgress">+</button>
          </div>
          <div class="board-task-body" data-column="inProgress">
            <button
              class="scroll-arrow arrow-up hidden"
              data-target="inProgress"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="no-tasks-placeholder hidden" id="placeholder-inProgress">
              <p class="p-no-task">No Tasks in Progress</p>
            </div>
            <div id="inProgress" class="task-cards"></div>
            <button
              class="scroll-arrow arrow-down hidden"
              data-target="inProgress"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board-task">
          <div class="board-task-header">
            <h4>Await feedback</h4>
            <button class="plus-btn" data-action="add-task" data-status="await">+</button>
          </div>
          <div class="board-task-body" data-column="await">
            <button
              class="scroll-arrow arrow-up hidden"
              data-target="await"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="no-tasks-placeholder hidden" id="placeholder-await">
              <p class="p-no-task">No Task to await feedback</p>
            </div>
            <div id="await" class="task-cards"></div>

            <button
              class="scroll-arrow arrow-down hidden"
              data-target="await"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board-task">
          <div class="board-task-header">
            <h4>Done</h4>
          </div>
          <div class="board-task-body" data-column="done">
            <button
              class="scroll-arrow arrow-up hidden"
              data-target="done"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="no-tasks-placeholder hidden" id="placeholder-done">
              <p class="p-no-task">No Task is done</p>
            </div>
            <div id="done" class="task-cards"></div>

            <button
              class="scroll-arrow arrow-down hidden"
              data-target="done"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>
      </section>
      <span id="message-box"></span>
    </main>
    <dialog id="openDialogBoard"></dialog>
    <script type="module" src="./js/pages/board/boardPage.js"></script>
  </body>
</html>
