<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Board</title>
    <link rel="shortcut icon" href="./assets/img/logo-light.svg" type="image/x-icon" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/addTask.css" />
    <link rel="stylesheet" href="./css/assets.css" />
    <link rel="stylesheet" href="./css/board.css" />
    <link rel="stylesheet" href="./css/moveOverlay.css" />
    <link rel="stylesheet" href="./css/editboard.css" />
    <link rel="stylesheet" href="./css/confirmDialog.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/standard.css" />
  </head>

  <body>
    <aside class="sidebar"></aside>

    <main class="page page--full board">
      <section class="board__bar">
        <h1>Board</h1>
        <div class="board__search-wrap">
          <div class="board__search">
            <input class="board__search-input" type="text" role="search" placeholder="Find Task" />
            <div class="board__search-divider"></div>
            <button class="board__search-btn" data-action="search-task">
              <img src="./assets/icons/search.svg" class="board__search-icon" />
            </button>
          </div>
          <button class="primary-btn board__add-btn" data-action="add-task" data-status="toDo">Add task +</button>
        </div>
      </section>

      <section class="board__bar-mobile">
        <div class="board__mobile-header">
          <h1>Board</h1>
          <button class="board__add-btn-mobile" data-action="add-task" data-status="toDo">+</button>
        </div>
        <div class="board__search-wrap">
          <div class="board__search">
            <input class="board__search-input" type="text" role="search" placeholder="Find Task" />
            <div class="board__search-divider"></div>
            <button class="board__search-btn" data-action="search-task">
              <img src="./assets/icons/search.svg" class="board__search-icon" />
            </button>
          </div>
        </div>
      </section>

      <section class="board__columns">
        <div class="board__column">
          <div class="board__column-header">
            <h4>Triage</h4>
            <button class="board__plus-btn" data-action="add-task" data-status="triage">+</button>
          </div>
          <div class="board__column-body" data-column="triage">
            <button
              class="board__arrow board__arrow--up board__arrow--hidden"
              data-target="triage"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="board__placeholder board__placeholder--hidden" data-placeholder="triage">
              <p class="board__placeholder-text">No tasks in Triage</p>
            </div>
            <div class="board__cards" data-cards="triage"></div>

            <button
              class="board__arrow board__arrow--down board__arrow--hidden"
              data-target="triage"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board__column">
          <div class="board__column-header">
            <h4>To do</h4>
            <button class="board__plus-btn" data-action="add-task" data-status="toDo">+</button>
          </div>
          <div class="board__column-body" data-column="toDo">
            <button
              class="board__arrow board__arrow--up board__arrow--hidden"
              data-target="toDo"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="board__placeholder board__placeholder--hidden" data-placeholder="toDo">
              <p class="board__placeholder-text">No tasks in To do</p>
            </div>
            <div class="board__cards" data-cards="toDo"></div>
            <button
              class="board__arrow board__arrow--down board__arrow--hidden"
              data-target="toDo"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board__column">
          <div class="board__column-header">
            <h4>In progress</h4>
            <button class="board__plus-btn" data-action="add-task" data-status="inProgress">+</button>
          </div>
          <div class="board__column-body" data-column="inProgress">
            <button
              class="board__arrow board__arrow--up board__arrow--hidden"
              data-target="inProgress"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="board__placeholder board__placeholder--hidden" data-placeholder="inProgress">
              <p class="board__placeholder-text">No tasks in In progress</p>
            </div>
            <div class="board__cards" data-cards="inProgress"></div>
            <button
              class="board__arrow board__arrow--down board__arrow--hidden"
              data-target="inProgress"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board__column">
          <div class="board__column-header">
            <h4>Await feedback</h4>
            <button class="board__plus-btn" data-action="add-task" data-status="await">+</button>
          </div>
          <div class="board__column-body" data-column="await">
            <button
              class="board__arrow board__arrow--up board__arrow--hidden"
              data-target="await"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="board__placeholder board__placeholder--hidden" data-placeholder="await">
              <p class="board__placeholder-text">No tasks in Await feedback</p>
            </div>
            <div class="board__cards" data-cards="await"></div>

            <button
              class="board__arrow board__arrow--down board__arrow--hidden"
              data-target="await"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="board__column">
          <div class="board__column-header">
            <h4>Done</h4>
          </div>
          <div class="board__column-body" data-column="done">
            <button
              class="board__arrow board__arrow--up board__arrow--hidden"
              data-target="done"
              data-action="scroll-column"
              data-direction="-1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,11 8,5 14,11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="board__placeholder board__placeholder--hidden" data-placeholder="done">
              <p class="board__placeholder-text">No tasks in Done</p>
            </div>
            <div class="board__cards" data-cards="done"></div>

            <button
              class="board__arrow board__arrow--down board__arrow--hidden"
              data-target="done"
              data-action="scroll-column"
              data-direction="1"
            >
              <svg class="board__arrow-icon" width="16" height="16" viewBox="0 0 16 16">
                <polyline
                  points="2,5 8,11 14,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>
      </section>
      <span class="toast toast--content"></span>
    </main>
    <dialog class="task-dialog"></dialog>
    <dialog class="confirm-dialog">
      <p class="confirm-dialog__text" tabindex="-1" autofocus></p>
      <div class="confirm-dialog__actions">
        <button
          class="secondary-btn confirm-dialog__btn confirm-dialog__btn--cancel"
          type="button"
          data-confirm="false"
        >
          Cancel
        </button>
        <button class="primary-btn confirm-dialog__btn" type="button" data-confirm="true">Delete</button>
      </div>
    </dialog>

    <dialog class="viewer" aria-label="Image viewer">
      <header class="viewer__bar">
        <p class="viewer__info"></p>
        <div class="viewer__actions">
          <a class="viewer__btn viewer__download" href="" download aria-label="Download image">
            <svg class="viewer__icon" viewBox="0 -960 960 960" aria-hidden="true">
              <path
                d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"
                fill="currentColor"
              />
            </svg>
          </a>
          <button class="viewer__btn" type="button" data-action="close-viewer" aria-label="Close">
            <svg class="viewer__icon" viewBox="0 -960 960 960" aria-hidden="true">
              <path
                d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"
                fill="currentColor"
              />
            </svg>
          </button>
        </div>
      </header>
      <figure class="viewer__stage">
        <img class="viewer__image" src="" alt="" />
      </figure>
      <nav class="viewer__controls" aria-label="Image controls">
        <button
          class="viewer__btn viewer__arrow viewer__arrow--prev"
          type="button"
          data-action="previous-image"
          aria-label="Previous image"
        >
          <svg class="viewer__icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path d="m313-440 224 224-57 57-320-320 320-320 57 57-224 224h487v80H313Z" fill="currentColor" />
          </svg>
        </button>
        <div class="viewer__zoom">
          <button class="viewer__btn" type="button" data-action="zoom-out" aria-label="Zoom out">
            <svg class="viewer__icon" viewBox="0 -960 960 960" aria-hidden="true">
              <path
                d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400ZM280-540v-80h200v80H280Z"
                fill="currentColor"
              />
            </svg>
          </button>
          <button class="viewer__btn" type="button" data-action="zoom-in" aria-label="Zoom in">
            <svg class="viewer__icon" viewBox="0 -960 960 960" aria-hidden="true">
              <path
                d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Zm-40-60v-80h-80v-80h80v-80h80v80h80v80h-80v80h-80Z"
                fill="currentColor"
              />
            </svg>
          </button>
        </div>
        <button
          class="viewer__btn viewer__arrow viewer__arrow--next"
          type="button"
          data-action="next-image"
          aria-label="Next image"
        >
          <svg class="viewer__icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path d="M647-440H160v-80h487L423-744l57-57 320 320-320 320-57-57 224-224Z" fill="currentColor" />
          </svg>
        </button>
      </nav>
    </dialog>

    <script type="module" src="./js/pages/board/boardPage.js"></script>
  </body>
</html>
