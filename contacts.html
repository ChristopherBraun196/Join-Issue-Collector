<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Contacts</title>
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/assets.css" />
    <link rel="stylesheet" href="./css/contact.css" />
    <link rel="stylesheet" href="./css/confirmDialog.css" />
    <link rel="stylesheet" href="./css/contactDialog.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/standard.css" />
    <link rel="shortcut icon" href="./assets/img/logo-light.png" type="image/x-icon" />
  </head>

  <body>
    <aside class="sidebar"></aside>
    <aside class="contacts__panel">
      <button class="primary-btn contacts__add-btn" data-action="open-dialog">
        Add new contact <img src="./assets/icons/person_add.svg" />
      </button>
    </aside>

    <main class="page contacts__main">
      <button class="contacts__back" data-action="back">
        <img src="./assets/icons/arrow-back.svg" class="contacts__back-icon" />
      </button>
      <div class="headline">
        <h1 class="headline__title">Contacts</h1>
        <div class="headline__line"></div>
        <a class="headline__subtitle">Better with a team</a>
      </div>
    </main>

    <button class="contacts__fab" data-action="open-dialog">
      <img src="./assets/icons/person_add.svg" class="contacts__fab-icon" />
    </button>

    <dialog class="confirm-dialog">
      <p class="confirm-dialog__text" tabindex="-1" autofocus></p>
      <div class="confirm-dialog__actions">
        <button
          class="secondary-btn confirm-dialog__btn confirm-dialog__btn--cancel"
          type="button"
          data-confirm="false"
        >
          Cancel
        </button>
        <button class="primary-btn confirm-dialog__btn" type="button" data-confirm="true">Delete</button>
      </div>
    </dialog>
    <div class="toast toast--content" popover="manual"></div>
    <script type="module" src="./js/pages/contacts/contacts.js"></script>
  </body>
</html>
