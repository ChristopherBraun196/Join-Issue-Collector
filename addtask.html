<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Add Task</title>
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/addTask.css" />
    <link rel="stylesheet" href="./css/assets.css" />
    <link rel="stylesheet" href="./css/editboard.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/standard.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="shortcut icon" href="./assets/img/logo-light.svg" type="image/x-icon" />
  </head>

  <body>
    <aside class="sidebar"></aside>

    <main class="page page--full">
      <section class="add-task">
        <header id="add-task-header">
          <h1>Add Task</h1>
        </header>
        <form class="add-task-form" data-status="toDo" id="add-task-form" novalidate>
          <div id="left-side-form">
            <div id="task-title">
              <label for="title">Title<span class="required">*</span></label>
              <input
                type="text"
                name="title"
                placeholder="Enter a title"
                required
                data-error-msg="Please enter a title"
              />
              <span class="field-error-msg"></span>
            </div>
            <div id="task-description">
              <label for="description">Description</label>
              <textarea name="description" id="description" cols="30" rows="5"></textarea>
            </div>
            <div id="task-due-date">
              <label for="due-date">Due Date<span class="required">*</span></label>
              <input type="date" id="due-date" name="due-date" required data-validate-date />
              <span class="field-error-msg"></span>
            </div>
          </div>
          <div id="right-side-task">
            <div id="task-priority">
              <label for="task-priority-btns">Priority</label>
              <div id="task-priority-btns">
                <button class="priority-btn urgent" data-action="set-priority" type="button">
                  Urgent <span><img src="./assets/icons/priority-urgent.svg" alt="Urgent priority icon" /></span>
                </button>
                <button class="priority-btn medium set" data-action="set-priority" type="button">
                  Medium<span><img src="./assets/icons/priority-medium.svg" alt="Medium priority icon" /></span>
                </button>
                <button class="priority-btn low" data-action="set-priority" type="button">
                  Low<span><img src="./assets/icons/priority-low.svg" alt="Low priority icon" /></span>
                </button>
              </div>
            </div>
            <div id="task-assigned-to">
              <label>Assigned to</label>
              <div class="custom-select-wrapper" id="assigned-wrapper">
                <div class="custom-select-trigger" data-action="toggle-dropdown" data-dropdown="assigned">
                  <span id="assigned-placeholder">Select contacts to assign</span>
                  <img src="./assets/icons/arrow_drop_down.svg" class="select-arrow" />
                </div>
                <div class="custom-select-dropdown" id="assigned-dropdown">
                  <div id="custom-select-dropdown-inner"></div>
                </div>
              </div>
              <div id="assigned-badges"></div>
            </div>
            <div id="task-category">
              <label>Category<span class="required">*</span></label>
              <div class="custom-select-wrapper" id="category-wrapper">
                <input type="hidden" name="category" required data-error-msg="Please select a category" />
                <span class="field-error-msg"></span>
                <div class="custom-select-trigger" data-action="toggle-dropdown" data-dropdown="category">
                  <span id="category-placeholder">Select task category</span>
                  <img src="./assets/icons/arrow_drop_down.svg" class="select-arrow" />
                </div>
                <div class="custom-select-dropdown" id="category-dropdown">
                  <div class="custom-select-dropdown-inner">
                    <div class="custom-option" data-action="select-category" data-value="technical-task">
                      <span>Technical Task</span>
                    </div>
                    <div class="custom-option" data-action="select-category" data-value="user-story">
                      <span>User Story</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div id="task-subtasks">
              <label>Subtasks</label>
              <div class="subtask-input-wrapper" id="subtask-wrapper">
                <input type="text" id="subtask-input" placeholder="Add new Subtask" />
                <div class="subtask-actions" id="subtask-actions">
                  <div class="subtask-confirm-btns" id="subtask-confirm-btns">
                    <button class="subtask-icon-btn" data-action="clear-subtask" type="button">
                      <img src="./assets/icons/close.svg" alt="Cancel" />
                    </button>
                    <div class="subtask-divider"></div>
                    <button class="subtask-icon-btn" data-action="add-subtask" type="button">
                      <img src="./assets/icons/check-dark.svg" alt="Confirm" />
                    </button>
                  </div>
                </div>
              </div>
              <ul id="subtask-list"></ul>
            </div>
          </div>
        </form>
        <div id="add-task-form-footer" class="mobile">
          <p><span class="required">*</span> This field is required</p>
          <div id="task-btns">
            <button id="clear-task-form" class="secondary-btn" type="button" data-action="clear-form">
              Clear <img src="./assets/icons/close.svg" alt="Cross icon" />
            </button>
            <button id="create-task" class="primary-btn" form="add-task-form" type="submit">
              Create Task <img src="./assets/icons/check.svg" alt="Check icon" />
            </button>
          </div>
        </div>
      </section>
      <span id="message-box"></span>
    </main>
    <script type="module" src="./js/pages/addTask/addTaskPage.js"></script>
  </body>
</html>
