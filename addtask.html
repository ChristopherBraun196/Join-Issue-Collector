<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Add Task</title>
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/addTask.css" />
    <link rel="stylesheet" href="./css/assets.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/standard.css" />
    <link rel="shortcut icon" href="./assets/img/logo-light.svg" type="image/x-icon" />
  </head>

  <body>
    <aside class="sidebar"></aside>

    <main class="page page--full">
      <section class="add-task">
        <header class="add-task__header">
          <h1>Add Task</h1>
        </header>
        <form class="task-form" data-status="toDo" id="add-task-form" novalidate>
          <div class="task-form__column">
            <div class="task-form__field">
              <label for="title">Title<span class="task-form__required">*</span></label>
              <input
                type="text"
                class="task-form__input"
                name="title"
                placeholder="Enter a title"
                required
                data-error-msg="Please enter a title"
              />
              <span class="task-form__error"></span>
            </div>
            <div class="task-form__field">
              <label for="description">Description</label>
              <textarea class="task-form__input" name="description" id="description" cols="30" rows="5"></textarea>
            </div>
            <div class="task-form__field">
              <label for="due-date">Due Date<span class="task-form__required">*</span></label>
              <input
                type="date"
                class="task-form__input"
                id="due-date"
                name="due-date"
                required
                data-validate-date
                data-error-msg="Please pick a due date"
              />
              <span class="task-form__error"></span>
            </div>
          </div>
          <div class="task-form__column task-form__column--right">
            <div class="task-form__field">
              <label for="task-priority-btns">Priority</label>
              <div class="task-form__priority">
                <button
                  class="task-form__priority-btn task-form__priority-btn--urgent"
                  data-action="set-priority"
                  type="button"
                >
                  Urgent
                  <span class="task-form__priority-icon"
                    ><img
                      class="task-form__priority-img"
                      src="./assets/icons/priority-urgent.svg"
                      alt="Urgent priority icon"
                  /></span>
                </button>
                <button
                  class="task-form__priority-btn task-form__priority-btn--medium task-form__priority-btn--active"
                  data-action="set-priority"
                  type="button"
                >
                  Medium<span class="task-form__priority-icon"
                    ><img
                      class="task-form__priority-img"
                      src="./assets/icons/priority-medium.svg"
                      alt="Medium priority icon"
                  /></span>
                </button>
                <button
                  class="task-form__priority-btn task-form__priority-btn--low"
                  data-action="set-priority"
                  type="button"
                >
                  Low<span class="task-form__priority-icon"
                    ><img class="task-form__priority-img" src="./assets/icons/priority-low.svg" alt="Low priority icon"
                  /></span>
                </button>
              </div>
            </div>
            <div class="task-form__field">
              <label>Assigned to</label>
              <div class="dropdown dropdown--assigned">
                <div class="dropdown__trigger" data-action="toggle-dropdown" data-dropdown="assigned">
                  <span class="dropdown__placeholder">Select contacts to assign</span>
                  <img src="./assets/icons/arrow_drop_down.svg" class="dropdown__arrow" />
                </div>
                <div class="dropdown__menu">
                  <div class="dropdown__list"></div>
                </div>
              </div>
              <div class="task-form__badges"></div>
            </div>
            <div class="task-form__field">
              <label>Category<span class="task-form__required">*</span></label>
              <div class="dropdown dropdown--category">
                <input
                  type="hidden"
                  class="task-form__input"
                  name="category"
                  required
                  data-error-msg="Please select a category"
                />
                <span class="task-form__error"></span>
                <div class="dropdown__trigger" data-action="toggle-dropdown" data-dropdown="category">
                  <span class="dropdown__placeholder">Select task category</span>
                  <img src="./assets/icons/arrow_drop_down.svg" class="dropdown__arrow" />
                </div>
                <div class="dropdown__menu">
                  <div class="dropdown__list">
                    <div class="dropdown__option" data-action="select-category" data-value="technical-task">
                      <span class="dropdown__label">Technical Task</span>
                    </div>
                    <div class="dropdown__option" data-action="select-category" data-value="user-story">
                      <span class="dropdown__label">User Story</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="task-form__field">
              <label>Subtasks</label>
              <div class="subtask__input-wrap">
                <input type="text" class="subtask__input" placeholder="Add new Subtask" />
                <div class="subtask__actions">
                  <div class="subtask__confirm">
                    <button class="subtask__btn" data-action="clear-subtask" type="button">
                      <img class="subtask__btn-icon" src="./assets/icons/close.svg" alt="Cancel" />
                    </button>
                    <div class="subtask__divider"></div>
                    <button class="subtask__btn" data-action="add-subtask" type="button">
                      <img class="subtask__btn-icon" src="./assets/icons/check-dark.svg" alt="Confirm" />
                    </button>
                  </div>
                  <button class="subtask__btn subtask__plus" data-action="focus-subtask" type="button" aria-label="Add subtask"><svg class="subtask__btn-icon" viewBox="0 0 19 19" aria-hidden="true"><path d="M8 10.6667H0V8H8V0H10.6667V8H18.6667V10.6667H10.6667V18.6667H8V10.6667Z" fill="currentColor"/></svg></button>
                </div>
              </div>
              <ul class="subtask__list"></ul>
            </div>
          </div>
        </form>
        <div class="task-form__footer task-form__footer--page">
          <p><span class="task-form__required">*</span> This field is required</p>
          <div class="task-form__buttons">
            <button class="secondary-btn task-form__btn task-form__btn--clear" type="button" data-action="clear-form">
              Clear <img class="task-form__btn-icon" src="./assets/icons/close.svg" alt="Cross icon" />
            </button>
            <button class="primary-btn task-form__btn task-form__btn--create" form="add-task-form" type="submit">
              Create Task <img class="task-form__btn-icon" src="./assets/icons/check.svg" alt="Check icon" />
            </button>
          </div>
        </div>
      </section>
      <span class="toast"></span>
    </main>
    <script type="module" src="./js/pages/addTask/addTaskPage.js"></script>
  </body>
</html>
