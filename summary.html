<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Summary</title>
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/assets.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/standard.css" />
    <link rel="stylesheet" href="./css/summary.css" />
    <link rel="shortcut icon" href="./assets/img/logo-light.svg" type="image/x-icon" />
  </head>

  <body>
    <aside class="sidebar"></aside>

    <main class="page page--full summary">
      <div class="headline">
        <h1 class="headline__title">Join 360</h1>
        <div class="headline__line"></div>
        <a class="headline__subtitle">Key Metrics at a Glance</a>
      </div>

      <div class="summary__content">
        <div class="summary__grid">
          <div class="summary__row summary__row--first">
            <div class="summary__bubble">
              <div class="summary__icon">
                <svg width="69" height="69" viewBox="0 0 69 69" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle class="summary__icon-bg" cx="34.5" cy="34.5" r="34.5" fill="#2A3647" />
                  <mask
                    id="mask0_446529_6089"
                    style="mask-type: alpha"
                    maskUnits="userSpaceOnUse"
                    x="18"
                    y="18"
                    width="33"
                    height="33"
                  >
                    <rect x="18.5" y="18.5" width="32" height="32" fill="#D9D9D9" />
                  </mask>
                  <g mask="url(#mask0_446529_6089)">
                    <path
                      class="summary__icon-symbol"
                      d="M25.1667 43.8332H27.0333L38.5333 32.3332L36.6667 30.4665L25.1667 41.9665V43.8332ZM44.2333 30.3998L38.5667 24.7998L40.4333 22.9332C40.9444 22.4221 41.5722 22.1665 42.3167 22.1665C43.0611 22.1665 43.6889 22.4221 44.2 22.9332L46.0667 24.7998C46.5778 25.3109 46.8444 25.9276 46.8667 26.6498C46.8889 27.3721 46.6444 27.9887 46.1333 28.4998L44.2333 30.3998ZM42.3 32.3665L28.1667 46.4998H22.5V40.8332L36.6333 26.6998L42.3 32.3665Z"
                      fill="white"
                    />
                  </g>
                </svg>
              </div>
              <div class="summary__counter">
                <div data-count="todo" class="summary__count"></div>
                <a>To-do</a>
              </div>
            </div>
            <div class="summary__bubble">
              <div class="summary__icon">
                <svg width="69" height="69" viewBox="0 0 69 69" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle class="summary__icon-bg" cx="34.5" cy="34.5" r="34.5" fill="#2A3647" />
                  <path
                    class="summary__icon-check"
                    d="M19.5283 34.5001L30.7571 45.5662L49.4717 23.4341"
                    stroke="white"
                    stroke-width="7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
              <div class="summary__counter">
                <div data-count="done" class="summary__count"></div>
                <a>Done</a>
              </div>
            </div>
          </div>

          <div class="summary__row summary__row--second">
            <div class="summary__bubble summary__bubble--deadline">
              <div class="summary__urgent">
                <img src="./assets/icons/urgent_icon.svg" />
                <div class="summary__counter">
                  <div data-count="urgent" class="summary__count"></div>
                  <a>Urgent</a>
                </div>
              </div>
              <div class="summary__divider"></div>
              <div class="summary__counter">
                <div class="summary__deadline"></div>
                <a>Upcoming Deadline</a>
              </div>
            </div>

            <div class="summary__bubble">
              <div class="summary__counter">
                <div data-count="email-requests" class="summary__count summary__count--gradient"></div>
                <a>Email requests</a>
              </div>
            </div>
          </div>

          <div class="summary__row summary__row--last">
            <div class="summary__bubble">
              <div class="summary__counter">
                <div data-count="board" class="summary__count"></div>
                <a>Tasks in Board </a>
              </div>
            </div>
            <div class="summary__bubble">
              <div class="summary__counter">
                <div data-count="progress" class="summary__count"></div>
                <a>Tasks in Progress</a>
              </div>
            </div>
            <div class="summary__bubble">
              <div class="summary__counter">
                <div data-count="feedback" class="summary__count"></div>
                <a>Awaiting Feedback</a>
              </div>
            </div>
          </div>
        </div>

        <div class="summary__greeting">
          <div class="summary__greeting-text"></div>
          <div class="summary__greeting-name"></div>
        </div>
      </div>
    </main>
    <script type="module" src="./js/pages/summary/summary.js"></script>
  </body>
</html>
